spring:
  application:
    name: payment-service
  
  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3307/payment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: PaymentServiceHikariCP
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        # Ensure enums are stored as VARCHAR in DB to align with Flyway schema
        type:
          preferred_enum_jdbc_type: varchar
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false
  
  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redispass}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
  
  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour default (in milliseconds)
      cache-null-values: false

# Payment Gateway Configuration
payment:
  gateway:
    default: ${PAYMENT_GATEWAY_DEFAULT:STRIPE}

stripe:
  apikey: ${STRIPE_API_KEY:}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:}

razorpay:
  id: ${RAZORPAY_KEY_ID:}
  secret: ${RAZORPAY_KEY_SECRET:}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:}
  enabled: ${RAZORPAY_ENABLED:false}

# Actuator Configuration (Spring Boot 3.x)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
      base-path: /actuator
  
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  
  health:
    redis:
      enabled: true
    db:
      enabled: true
  
  # Prometheus configuration (Spring Boot 3.x syntax)
  prometheus:
    metrics:
      export:
        enabled: true
  
  # Observations with key-values (replaces metrics.tags)
  observations:
    key-values:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:development}
  
  # Metrics distribution
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

# Logging Configuration
logging:
  level:
    root: INFO
    rahim.learning.paymentservices: DEBUG
    org.springframework.web: INFO
    org.springframework.data.redis: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always