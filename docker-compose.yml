version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: payment-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: payment_db
      MYSQL_USER: paymentuser
      MYSQL_PASSWORD: paymentpass
    ports:
      - "3307:3306"  # Expose MySQL on host port 3307 to avoid conflicts with local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - payment-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payment-service-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - payment-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: payment-service-redis-ui
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_PASSWORD:-redispass}"
    ports:
      - "8082:8081"
    depends_on:
      - redis
    networks:
      - payment-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: payment-service-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - payment-network

volumes:
  mysql_data:
  redis_data:

networks:
  payment-network:
    driver: bridge
